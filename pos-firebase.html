<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai Factory POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// Firebase config mo boss
const firebaseConfig = {
  apiKey: "AIzaSyAL_la4X9QVwRtvnoVrbNXY-McE3C9MIHA",
  authDomain: "siomai-factory.firebaseapp.com",
  projectId: "siomai-factory",
  storageBucket: "siomai-factory.firebasestorage.app",
  messagingSenderId: "302435729152",
  appId: "1:302435729152:web:d887cdbd1ef6f1aafd3de5",
  measurementId: "G-G53PC02YJW"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// Cart + Products
let cart = [];
let products = [];

// Load products
async function loadProducts() {
  const q = query(collection(db, "products"), orderBy("name"));
  const snap = await getDocs(q);
  products = [];
  snap.forEach(d => products.push({id: d.id,...d.data()}));
  renderProducts();
}

// Render products
function renderProducts() {
  const grid = document.getElementById('products');
  grid.innerHTML = products.map(p => `
    <div class="bg-white p-3 rounded-lg shadow">
      <div class="font-bold">${p.name}</div>
      <div class="text-sm text-gray-600">Stock: ${p.stock} | ₱${p.price}</div>
      <button onclick="addToCart('${p.id}')" class="mt-2 w-full bg-blue-500 text-white py-1 rounded">Add</button>
    </div>
  `).join('');
}

// Add to cart
window.addToCart = (id) => {
  const p = products.find(x => x.id == id);
  if(p.stock <= 0) return alert('Out of stock!');
  const item = cart.find(x => x.id == id);
  if(item) item.qty++;
  else cart.push({...p, qty: 1});
  renderCart();
}

// Render cart
function renderCart() {
  const list = document.getElementById('cart');
  let total = 0;
  list.innerHTML = cart.map(i => {
    total += i.price * i.qty;
    return `<div class="flex justify-between">${i.name} x${i.qty} <span>₱${i.price*i.qty}</span></div>`;
  }).join('');
  document.getElementById('total').innerText = total;
}

// Checkout with Gcash
window.checkout = async () => {
  const payment = document.getElementById('payment').value;
  let gcashProof = null;

  if(payment == 'Gcash') {
    const file = document.getElementById('gcashFile').files[0];
    if(!file) return alert('Upload Gcash proof muna boss!');

    const fileRef = ref(storage, `gcash_proofs/${Date.now()}_${file.name}`);
    const snap = await uploadBytes(fileRef, file);
    gcashProof = await getDownloadURL(snap.ref);
    document.getElementById('preview').src = gcashProof;
  }

  // Save sale
  let total = cart.reduce((s,i) => s + i.price*i.qty, 0);
  let cost = cart.reduce((s,i) => s + (i.cost||0)*i.qty, 0);
  let netProfit = total - cost;

  await addDoc(collection(db, "sales"), {
    items: cart,
    total, cost, netProfit,
    payment,
    gcashProof,
    createdAt: serverTimestamp()
  });

  // Auto minus stock
  for(let i of cart) {
    const prodRef = doc(db, "products", i.id);
    await updateDoc(prodRef, {stock: i.stock - i.qty});
  }

  alert('Sale saved! Net Profit: ₱' + netProfit);
  cart = [];
  renderCart();
  loadProducts();
}

// Preview Gcash
window.previewGcash = (e) => {
  const file = e.target.files[0];
  if(file) document.getElementById('preview').src = URL.createObjectURL(file);
}

loadProducts();
</script>
</head>
<body class="bg-gray-100 p-4">
<h1 class="text-2xl font-bold mb-4">Siomai Factory POS</h1>

<div class="grid md:grid-cols-2 gap-4">
  <div>
    <h2 class="font-bold mb-2">Products</h2>
    <div id="products" class="grid grid-cols-2 gap-2"></div>
  </div>

  <div class="bg-white p-4 rounded-lg shadow">
    <h2 class="font-bold mb-2">Cart</h2>
    <div id="cart" class="mb-2"></div>
    <div class="font-bold">Total: ₱<span id="total">0</span></div>

    <select id="payment" class="w-full mt-2 p-2 border rounded">
      <option value="Cash">Cash</option>
      <option value="Gcash">Gcash</option>
    </select>

    <input type="file" id="gcashFile" accept="image/*" onchange="previewGcash(event)" class="mt-2 w-full">
    <img id="preview" class="mt-2 max-h-40 rounded">

    <button onclick="checkout()" class="mt-3 w-full bg-green-500 text-white py-2 rounded">Checkout</button>
  </div>
</div>
</body>
</html>
