<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai POS</title>
<style>
  body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 10px; }
  .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 10px; }
  h2 { text-align: center; color: #d32f2f; }
  .products { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .prod-btn { padding: 15px; background: #ff5722; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .prod-btn:active { background: #e64a19; }
  .cart { border-top: 2px solid #ddd; padding-top: 10px; }
  .cart-item { display: flex; justify-content: space-between; padding: 5px 0; }
  .total { font-size: 20px; font-weight: bold; text-align: right; margin: 10px 0; color: #d32f2f; }
  .pay-btn { width: 100%; padding: 15px; background: #4caf50; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 5px; }
  .pay-btn:active { background: #388e3c; }
  .gcash-section { margin-top: 10px; padding: 10px; background: #e3f2fd; border-radius: 8px; display: none; }
  input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
  @media print {
    body * { visibility: hidden; }
    #receipt, #receipt * { visibility: visible; }
    #receipt { position: absolute; left: 0; top: 0; width: 80mm; }
  }
  #receipt { display: none; }
</style>
</head>
<body>

<div class="container">
  <h2>🧆 SIOMAI POS</h2>
  
  <div class="products">
    <button class="prod-btn" onclick="addToCart('Pork Siomai', 35)">Pork Siomai<br>₱35</button>
    <button class="prod-btn" onclick="addToCart('Beef Siomai', 38)">Beef Siomai<br>₱38</button>
    <button class="prod-btn" onclick="addToCart('Chicken Siomai', 35)">Chicken Siomai<br>₱35</button>
    <button class="prod-btn" onclick="addToCart('Japanese Siomai', 40)">Japanese Siomai<br>₱40</button>
  </div>

  <div class="cart">
    <h3>Cart:</h3>
    <div id="cartItems">No items</div>
    <div class="total">Total: ₱<span id="total">0</span></div>
    
    <button class="pay-btn" onclick="checkout()">💰 Checkout</button>
    
    <div class="gcash-section" id="gcashSection">
      <label>GCash Reference No:</label>
      <input type="text" id="gcashRef" placeholder="Enter ref no">
      <button class="pay-btn" onclick="payGcash()">Confirm GCash Payment</button>
    </div>
  </div>
</div>

<!-- Receipt for printing -->
<div id="receipt"></div>

<script>
let cart = [];
let currentPayment = '';
let currentRef = '';

function addToCart(name, price) {
  let item = cart.find(i => i.name === name);
  if(item) {
    item.qty++;
  } else {
    cart.push({name: name, price: price, qty: 1});
  }
  displayCart();
}

function displayCart() {
  let html = '';
  let total = 0;
  cart.forEach((item, i) => {
    html += `<div class="cart-item">
      <span>${item.name} x${item.qty}</span>
      <span>₱${item.price * item.qty}</span>
    </div>`;
    total += item.price * item.qty;
  });
  document.getElementById('cartItems').innerHTML = html || 'No items';
  document.getElementById('total').innerText = total;
}

function checkout() {
  if(cart.length === 0) {
    alert('Cart is empty!');
    return;
  }
  currentPayment = 'Cash';
  saveSale(); // SAVE MUNA SA LOCALSTORAGE
  printReceipt();
  clearCart();
}

function payGcash() {
  let ref = document.getElementById('gcashRef').value;
  if(ref === '') {
    alert('Enter GCash Reference No!');
    return;
  }
  currentPayment = 'GCash';
  currentRef = ref;
  saveSale(); // SAVE MUNA SA LOCALSTORAGE
  printReceipt();
  clearCart();
}

// PINAKAMAHALAGA: SAVE SA LOCALSTORAGE PARA SA SALES REPORT
function saveSale() {
  let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  let sale = {
    date: new Date().toLocaleString(),
    items: [...cart],
    total: total,
    payment: currentPayment,
    ref: currentRef
  };
  
  let sales = JSON.parse(localStorage.getItem('sales') || '[]');
  sales.push(sale);
  localStorage.setItem('sales', JSON.stringify(sales));
}

function printReceipt() {
  let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  let itemsHtml = '';
  cart.forEach(item => {
    itemsHtml += `${item.name} x${item.qty} ................ ₱${item.price * item.qty}<br>`;
  });
  
  let receiptHtml = `
    <div style="font-family: monospace; font-size: 12px;">
      <center><b>SIOMAI HOUSE</b><br>
      123 Main St, Manila<br>
      Tel: 0912-345-6789</center><br>
      ${new Date().toLocaleString()}<br>
      ----------------------------<br>
      ${itemsHtml}
      ----------------------------<br>
      <b>TOTAL: ₱${total}</b><br>
      Payment: ${currentPayment}<br>
      ${currentRef ? 'Ref: ' + currentRef + '<br>' : ''}
      ----------------------------<br>
      <center>Thank you! Come again!</center>
    </div>
  `;
  
  document.getElementById('receipt').innerHTML = receiptHtml;
  document.getElementById('receipt').style.display = 'block';
  window.print();
  document.getElementById('receipt').style.display = 'none';
}

function clearCart() {
  cart = [];
  currentPayment = '';
  currentRef = '';
  document.getElementById('gcashSection').style.display = 'none';
  document.getElementById('gcashRef').value = '';
  displayCart();
}

// Para sa GCash button - WALA NANG selectGcash error
document.querySelector('.pay-btn').addEventListener('click', function(e) {
  if(e.target.innerText.includes('Checkout')) {
    document.getElementById('gcashSection').style.display = 'block';
  }
});
</script>

</body>
</html>
