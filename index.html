<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Manager - Siomai Factory</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
body {background:#FFF8E1; padding:10px;}
.container {max-width:500px; margin:auto; background:white; border-radius:16px; padding:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1); border-top:5px solid #D32F2F;}
h2 {color:#D32F2F; text-align:center; margin-bottom:12px;}
.back-btn {background:#757575; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; margin-bottom:10px; font-size:12px;}

.cat-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  margin-bottom:15px;
}
.cat-btn {
  padding:20px 10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg, #FFCC80, #FFB74D);
  color:#B71C1C;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}

.product-form {
  background:#FFF8E1;
  border:2px dashed #FFCC80;
  border-radius:10px;
  padding:12px;
  margin-bottom:15px;
}
.product-form input {
  width:100%;
  padding:10px;
  margin:5px 0;
  border:2px solid #FFE0B2;
  border-radius:6px;
  font-size:14px;
}
.add-prod-btn {
  width:100%;
  padding:12px;
  background:#2E7D32;
  color:white;
  border:none;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
  margin-top:5px;
  font-size:14px;
}

.prod-list {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
}
.prod-card {
  background:#FFFDF7;
  border:2px solid #FFCC80;
  border-radius:10px;
  padding:10px;
  text-align:center;
  position:relative;
}
.prod-name {font-weight:800; font-size:13px; color:#D32F2F; margin-bottom:6px;}
.prod-card input {
  width:100%;
  padding:6px;
  text-align:center;
  border:1px solid #ddd;
  border-radius:4px;
  margin:3px 0;
  font-size:12px;
}
.save-btn {
  width:100%;
  padding:6px;
  background:#1976D2;
  color:white;
  border:none;
  border-radius:4px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  margin-top:4px;
}
.delete-btn {
  position:absolute;
  top:4px;
  right:4px;
  background:#C62828;
  color:white;
  border:none;
  border-radius:50%;
  width:22px;
  height:22px;
  cursor:pointer;
  font-size:16px;
  line-height:1;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="container">
  <button class="back-btn" onclick="backToCategories()">← Back to Categories</button>
  <h2 id="catTitle">65's Siomai</h2>

  <!-- Add Product Form -->
  <div class="product-form">
    <h4 style="color:#D32F2F; margin-bottom:6px;">+ Add Product to <span id="catName">65's Siomai</span></h4>
    <input type="text" id="prodName" placeholder="Product Name ex: Pork Siomai">
    <input type="number" id="prodStocks" placeholder="Number of Stocks" value="100">
    <input type="number" id="prodPrice" placeholder="Price" value="8" step="0.01">
    <button class="add-prod-btn" onclick="addProduct()">Add Product</button>
  </div>

  <!-- Product List - Editable -->
  <div class="prod-list" id="prodList"></div>
</div>

<script>
let currentCat = '65s'; // Default sa 65's para sa screenshot mo
let products = JSON.parse(localStorage.getItem('products') || '{}');

// Init categories
['65s','30s','big','dumplings','siopao','sauce','others'].forEach(cat => {
  if(!products[cat]) products[cat] = [];
});

// Auto load 65's pag open
window.onload = function() {
  openCategory('65s');
}

function openCategory(cat) {
  currentCat = cat;
  const catNames = {
    '65s': "65's Siomai",
    '30s': "30's Siomai",
    'big': 'Big Siomai',
    'dumplings': 'Dumplings',
    'siopao': 'Siopao',
    'sauce': 'Sauce',
    'others': 'Others'
  };
  document.getElementById('catTitle').innerText = catNames[cat];
  document.getElementById('catName').innerText = catNames[cat];
  renderProducts();
}

function backToCategories() {
  alert('Dito mo na lang boss palitan yung category. Next gawa tayo category selector page.');
}

function addProduct() {
  const name = document.getElementById('prodName').value.trim();
  const stocks = parseInt(document.getElementById('prodStocks').value) || 0;
  const price = parseFloat(document.getElementById('prodPrice').value) || 0;

  if(!name || price <= 0) {
    alert('Lagay ka name at price boss!');
    return;
  }

  products[currentCat].push({id: Date.now(), name, stocks, price});
  localStorage.setItem('products', JSON.stringify(products));

  document.getElementById('prodName').value = '';
  document.getElementById('prodStocks').value = '100';
  document.getElementById('prodPrice').value = '8';

  renderProducts();
}

function renderProducts() {
  const list = document.getElementById('prodList');
  const prods = products[currentCat];

  if(prods.length === 0) {
    list.innerHTML = '<p style="grid-column:span 2; text-align:center; color:#999; padding:30px;">No products yet. Add muna boss!</p>';
    return;
  }

  let html = '';
  prods.forEach(prod => {
    html += `
      <div class="prod-card">
        <button class="delete-btn" onclick="deleteProduct(${prod.id})">×</button>
        <div class="prod-name">${prod.name}</div>
        <input type="number" id="stocks${prod.id}" value="${prod.stocks}" placeholder="Stocks">
        <input type="number" id="price${prod.id}" value="${prod.price}" step="0.01" placeholder="Price">
        <button class="save-btn" onclick="saveProduct(${prod.id})">Save Changes</button>
      </div>
    `;
  });
  list.innerHTML = html;
}

function saveProduct(prodId) {
  const prod = products[currentCat].find(p => p.id === prodId);
  prod.stocks = parseInt(document.getElementById('stocks' + prodId).value) || 0;
  prod.price = parseFloat(document.getElementById('price' + prodId).value) || 0;

  localStorage.setItem('products', JSON.stringify(products));

  // Quick feedback
  const btn = event.target;
  const oldText = btn.innerText;
  btn.innerText = '✓ Saved';
  btn.style.background = '#4CAF50';
  setTimeout(() => {
    btn.innerText = oldText;
    btn.style.background = '#1976D2';
  }, 800);
}

function deleteProduct(prodId) {
  if(confirm('Delete this product?')) {
    products[currentCat] = products[currentCat].filter(p => p.id!== prodId);
    localStorage.setItem('products', JSON.stringify(products));
    renderProducts();
  }
}
</script>
</body>
</html>
