<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai Factory POS - Categories</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
body {background:#FFF8E1; padding:10px;}
.container {max-width:500px; margin:auto; background:white; border-radius:16px; padding:15px; box-shadow:0 4px 15px rgba(0,0,0,0.1); border-top:5px solid #D32F2F;}
h2 {color:#D32F2F; text-align:center; margin-bottom:12px;}
.back-btn {background:#757575; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; margin-bottom:10px; font-size:12px;}

.cat-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  margin-bottom:15px;
}
.cat-btn {
  padding:20px 10px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg, #FFCC80, #FFB74D);
  color:#B71C1C;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}
.cat-btn:active {transform:scale(0.95);}

.product-form {
  background:#FFF8E1;
  border:2px dashed #FFCC80;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.product-form input {
  width:100%;
  padding:8px;
  margin:4px 0;
  border:2px solid #FFE0B2;
  border-radius:6px;
  font-size:13px;
}
.add-prod-btn {
  width:100%;
  padding:10px;
  background:#2E7D32;
  color:white;
  border:none;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
  margin-top:5px;
}

.prod-list {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:6px;
  margin-bottom:15px;
}
.prod-card {
  background:white;
  border:2px solid #FFCC80;
  border-radius:10px;
  padding:8px;
  text-align:center;
}
.prod-name {font-weight:700; font-size:12px; color:#D32F2F; margin-bottom:4px;}
.prod-info {font-size:11px; color:#666; margin:2px 0;}
.prod-card input {
  width:50px;
  padding:4px;
  text-align:center;
  border:1px solid #ddd;
  border-radius:4px;
  margin:4px 0;
  font-size:12px;
}
.add-cart-btn {
  width:100%;
  padding:6px;
  background:#D32F2F;
  color:white;
  border:none;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.cart {
  background:#FFF8E1;
  border-radius:8px;
  padding:10px;
  min-height:100px;
  margin-bottom:10px;
}
.cart-item {
  display:flex;
  justify-content:space-between;
  font-size:13px;
  padding:4px 0;
  border-bottom:1px dashed #ddd;
}
.total {
  font-size:22px;
  font-weight:900;
  color:#D32F2F;
  text-align:right;
  margin:10px 0;
}
.btn-group {display:flex; gap:6px;}
.btn {
  flex:1;
  padding:14px;
  border:none;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}
.checkout {background:#4CAF50; color:white;}
.clear {background:#f44336; color:white;}
</style>
</head>
<body>

<div class="container">
  <div id="mainMenu">
    <h2>📋 Main Menu</h2>
    <p style="text-align:center; color:#666; font-size:12px; margin-bottom:12px;">Welcome to my POS, admin!</p>

    <div class="cat-grid">
      <button class="cat-btn" onclick="showPOS()">🛒 Products<br>POS Sales</button>
      <button class="cat-btn">📦 Daily<br>Production</button>
      <button class="cat-btn">💸 Daily<br>Expenses</button>
      <button class="cat-btn">💰 Daily<br>Income</button>
      <button class="cat-btn">📊 Monthly<br>Expenses</button>
      <button class="cat-btn">📈 Net<br>Profit</button>
    </div>
  </div>

  <div id="posPage" style="display:none;">
    <button class="back-btn" onclick="backToMenu()">← Back to Menu</button>
    <h2>🛒 Select Category</h2>

    <div class="cat-grid">
      <button class="cat-btn" onclick="openCategory('65s')">65's</button>
      <button class="cat-btn" onclick="openCategory('30s')">30's</button>
      <button class="cat-btn" onclick="openCategory('big')">Big SIOMAI</button>
      <button class="cat-btn" onclick="openCategory('dumplings')">Dumplings</button>
      <button class="cat-btn" onclick="openCategory('siopao')">SIOPAO</button>
      <button class="cat-btn" onclick="openCategory('sauce')">Sauce</button>
      <button class="cat-btn" onclick="openCategory('others')">Others</button>
    </div>
  </div>

  <div id="categoryPage" style="display:none;">
    <button class="back-btn" onclick="backToCategories()">← Back to Categories</button>
    <h2 id="catTitle"></h2>

    <!-- Add Product Form -->
    <div class="product-form">
      <h4 style="color:#D32F2F; margin-bottom:5px;">+ Add Product to <span id="catName"></span></h4>
      <input type="text" id="prodName" placeholder="Product Name ex: Pork Siomai">
      <input type="number" id="prodStocks" placeholder="Number of Stocks" value="100">
      <input type="number" id="prodPrice" placeholder="Price" value="8" step="0.01">
      <button class="add-prod-btn" onclick="addProduct()">Add Product</button>
    </div>

    <!-- Product List -->
    <div class="prod-list" id="prodList"></div>

    <!-- Cart -->
    <div class="cart" id="cart">
      <p style="text-align:center; color:#999; font-size:12px;">No items in cart</p>
    </div>
    <div class="total" id="total">Total: ₱0</div>

    <div class="btn-group">
      <button class="btn checkout" onclick="checkout()">✓ CHECKOUT</button>
      <button class="btn clear" onclick="clearCart()">🗑️ CLEAR</button>
    </div>
  </div>
</div>

<script>
let currentCat = '';
let products = JSON.parse(localStorage.getItem('products') || '{}');
let cart = [];

// Init categories
['65s','30s','big','dumplings','siopao','sauce','others'].forEach(cat => {
  if(!products[cat]) products[cat] = [];
});

function showPOS() {
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('posPage').style.display = 'block';
}

function backToMenu() {
  document.getElementById('posPage').style.display = 'none';
  document.getElementById('mainMenu').style.display = 'block';
}

function openCategory(cat) {
  currentCat = cat;
  document.getElementById('posPage').style.display = 'none';
  document.getElementById('categoryPage').style.display = 'block';

  const catNames = {
    '65s': "65's Siomai",
    '30s': "30's Siomai",
    'big': 'Big Siomai',
    'dumplings': 'Dumplings',
    'siopao': 'Siopao',
    'sauce': 'Sauce',
    'others': 'Others'
  };

  document.getElementById('catTitle').innerText = catNames[cat];
  document.getElementById('catName').innerText = catNames[cat];
  renderProducts();
}

function backToCategories() {
  document.getElementById('categoryPage').style.display = 'none';
  document.getElementById('posPage').style.display = 'block';
}

function addProduct() {
  const name = document.getElementById('prodName').value.trim();
  const stocks = parseInt(document.getElementById('prodStocks').value) || 0;
  const price = parseFloat(document.getElementById('prodPrice').value) || 0;

  if(!name || price <= 0) {
    alert('Lagay ka name at price boss!');
    return;
  }

  products[currentCat].push({id: Date.now(), name, stocks, price});
  localStorage.setItem('products', JSON.stringify(products));

  document.getElementById('prodName').value = '';
  document.getElementById('prodStocks').value = '100';
  document.getElementById('prodPrice').value = '8';

  renderProducts();
}

function renderProducts() {
  const list = document.getElementById('prodList');
  const prods = products[currentCat];

  if(prods.length === 0) {
    list.innerHTML = '<p style="grid-column:span 2; text-align:center; color:#999; padding:20px;">No products yet. Add muna boss!</p>';
    return;
  }

  let html = '';
  prods.forEach(prod => {
    html += `
      <div class="prod-card">
        <div class="prod-name">${prod.name}</div>
        <div class="prod-info">Stocks: ${prod.stocks}</div>
        <div class="prod-info">Price: ₱${prod.price}</div>
        <input type="number" id="qty${prod.id}" value="1" min="1" max="${prod.stocks}">
        <button class="add-cart-btn" onclick="addToCart(${prod.id})">Add to Cart</button>
      </div>
    `;
  });
  list.innerHTML = html;
}

function addToCart(prodId) {
  const prod = products[currentCat].find(p => p.id === prodId);
  const qty = parseInt(document.getElementById('qty' + prodId).value) || 1;

  if(qty > prod.stocks) {
    alert('Kulang stocks boss!');
    return;
  }

  const existing = cart.find(item => item.id === prodId);
  if(existing) {
    existing.qty += qty;
  } else {
    cart.push({id: prodId, name: prod.name, price: prod.price, qty});
  }

  renderCart();
}

function renderCart() {
  const cartDiv = document.getElementById('cart');
  let total = 0;

  if(cart.length === 0) {
    cartDiv.innerHTML = '<p style="text-align:center; color:#999; font-size:12px;">No items in cart</p>';
    document.getElementById('total').innerText = 'Total: ₱0';
    return;
  }

  let html = '';
  cart.forEach(item => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    html += `<div class="cart-item"><span>${item.name} x${item.qty}</span><span>₱${subtotal.toFixed(2)}</span></div>`;
  });

  cartDiv.innerHTML = html;
  document.getElementById('total').innerText = 'Total: ₱' + total.toFixed(2);
}

function checkout() {
  if(cart.length === 0) {
    alert('Add items muna boss!');
    return;
  }
  alert('✓ SALE COMPLETE\n' + document.getElementById('total').innerText);
  clearCart();
}

function clearCart() {
  cart = [];
  renderCart();
}
</script>
</body>
</html>
