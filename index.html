<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai Factory POS</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif;}
body {background:#FFF8E1; padding:15px; min-height:100vh;}
.container {
  max-width:480px;
  margin:auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 6px 20px rgba(0,0,0,0.12);
  border-top:6px solid #D32F2F;
}
h2 {
  color:#D32F2F;
  text-align:center;
  margin-bottom:8px;
  font-size:24px;
}
.subtitle {
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:20px;
}
.back-btn {
  background:#757575;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:15px;
  font-size:13px;
  font-weight:600;
}

/* Main Menu + Category Grid */
.menu-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
}
.menu-btn {
  padding:35px 10px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg, #FFCC80, #FFB74D);
  color:#B71C1C;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  text-align:center;
  line-height:1.4;
  transition:0.15s;
}
.menu-btn:active {transform:scale(0.95); background:#FFA726;}

/* Product Form */
.product-form {
  background:#FFF8E1;
  border:2px dashed #FFCC80;
  border-radius:12px;
  padding:15px;
  margin-bottom:18px;
}
.product-form h4 {
  color:#D32F2F;
  margin-bottom:10px;
  font-size:14px;
}
.product-form input {
  width:100%;
  padding:12px;
  margin:6px 0;
  border:2px solid #FFE0B2;
  border-radius:8px;
  font-size:14px;
  background:white;
}
.product-form input:focus {outline:none; border-color:#D32F2F;}
.add-prod-btn {
  width:100%;
  padding:14px;
  background:#2E7D32;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
  margin-top:8px;
  font-size:15px;
}

/* Product Cards */
.prod-list {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
}
.prod-card {
  background:#FFFDF7;
  border:2px solid #FFCC80;
  border-radius:12px;
  padding:12px;
  text-align:center;
  position:relative;
}
.prod-name {
  font-weight:800;
  font-size:13px;
  color:#D32F2F;
  margin-bottom:8px;
}
.prod-card input {
  width:100%;
  padding:8px;
  text-align:center;
  border:1.5px solid #ddd;
  border-radius:6px;
  margin:4px 0;
  font-size:13px;
}
.save-btn {
  width:100%;
  padding:8px;
  background:#1976D2;
  color:white;
  border:none;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  margin-top:6px;
}
.delete-btn {
  position:absolute;
  top:6px;
  right:6px;
  background:#C62828;
  color:white;
  border:none;
  border-radius:50%;
  width:24px;
  height:24px;
  cursor:pointer;
  font-size:18px;
  line-height:1;
  font-weight:bold;
}
.page {display:none;}
.page.active {display:block;}
.empty-msg {
  grid-column:span 2;
  text-align:center;
  color:#999;
  padding:40px 0;
  font-size:13px;
}
</style>
</head>
<body>

<div class="container">

  <!-- PAGE 1: MAIN MENU -->
  <div id="mainMenu" class="page active">
    <h2>📋 Main Menu</h2>
    <p class="subtitle">Welcome to my POS, admin!</p>

    <div class="menu-grid">
      <button class="menu-btn" onclick="showPage('categoryPage')">🛒 Products<br>POS Sales</button>
      <button class="menu-btn">📦 Daily<br>Production</button>
      <button class="menu-btn">💸 Daily<br>Expenses</button>
      <button class="menu-btn">💰 Daily<br>Income</button>
      <button class="menu-btn">📊 Monthly<br>Expenses</button>
      <button class="menu-btn">📈 Net<br>Profit</button>
    </div>
  </div>

  <!-- PAGE 2: SELECT CATEGORY -->
  <div id="categoryPage" class="page">
    <button class="back-btn" onclick="showPage('mainMenu')">← Back to Menu</button>
    <h2>🛒 Select Category</h2>

    <div class="menu-grid">
      <button class="menu-btn" onclick="openCategory('65s')">65's</button>
      <button class="menu-btn" onclick="openCategory('30s')">30's</button>
      <button class="menu-btn" onclick="openCategory('big')">Big SIOMAI</button>
      <button class="menu-btn" onclick="openCategory('dumplings')">Dumplings</button>
      <button class="menu-btn" onclick="openCategory('siopao')">SIOPAO</button>
      <button class="menu-btn" onclick="openCategory('sauce')">Sauce</button>
      <button class="menu-btn" onclick="openCategory('others')">Others</button>
    </div>
  </div>

  <!-- PAGE 3: PRODUCT MANAGER -->
  <div id="productPage" class="page">
    <button class="back-btn" onclick="showPage('categoryPage')">← Back to Categories</button>
    <h2 id="catTitle">65's Siomai</h2>

    <!-- Add Product Form -->
    <div class="product-form">
      <h4>+ Add Product to <span id="catName">65's Siomai</span></h4>
      <input type="text" id="prodName" placeholder="Product Name ex: Pork Siomai">
      <input type="number" id="prodStocks" placeholder="Number of Stocks" value="100">
      <input type="number" id="prodPrice" placeholder="Price" value="8" step="0.01">
      <button class="add-prod-btn" onclick="addProduct()">Add Product</button>
    </div>

    <!-- Product List -->
    <div class="prod-list" id="prodList"></div>
  </div>

</div>

<script>
let currentCat = '65s';
let products = JSON.parse(localStorage.getItem('products') || '{}');

// Init all categories
['65s','30s','big','dumplings','siopao','sauce','others'].forEach(cat => {
  if(!products[cat]) products[cat] = [];
});

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function openCategory(cat) {
  currentCat = cat;
  const catNames = {
    '65s': "65's Siomai",
    '30s': "30's Siomai",
    'big': 'Big SIOMAI',
    'dumplings': 'Dumplings',
    'siopao': 'SIOPAO',
    'sauce': 'Sauce',
    'others': 'Others'
  };
  document.getElementById('catTitle').innerText = catNames[cat];
  document.getElementById('catName').innerText = catNames[cat];
  showPage('productPage');
  renderProducts();
}

function addProduct() {
  const name = document.getElementById('prodName').value.trim();
  const stocks = parseInt(document.getElementById('prodStocks').value) || 0;
  const price = parseFloat(document.getElementById('prodPrice').value) || 0;

  if(!name || price <= 0) {
    alert('Lagay ka name at price boss!');
    return;
  }

  products[currentCat].push({id: Date.now(), name, stocks, price});
  localStorage.setItem('products', JSON.stringify(products));

  document.getElementById('prodName').value = '';
  document.getElementById('prodStocks').value = '100';
  document.getElementById('prodPrice').value = '8';

  renderProducts();
}

function renderProducts() {
  const list = document.getElementById('prodList');
  const prods = products[currentCat];

  if(prods.length === 0) {
    list.innerHTML = '<p class="empty-msg">No products yet. Add muna boss!</p>';
    return;
  }

  let html = '';
  prods.forEach(prod => {
    html += `
      <div class="prod-card">
        <button class="delete-btn" onclick="deleteProduct(${prod.id})">×</button>
        <div class="prod-name">${prod.name}</div>
        <input type="number" id="stocks${prod.id}" value="${prod.stocks}" placeholder="Stocks">
        <input type="number" id="price${prod.id}" value="${prod.price}" step="0.01" placeholder="Price">
        <button class="save-btn" onclick="saveProduct(${prod.id})">Save Changes</button>
      </div>
    `;
  });
  list.innerHTML = html;
}

function saveProduct(prodId) {
  const prod = products[currentCat].find(p => p.id === prodId);
  prod.stocks = parseInt(document.getElementById('stocks' + prodId).value) || 0;
  prod.price = parseFloat(document.getElementById('price' + prodId).value) || 0;

  localStorage.setItem('products', JSON.stringify(products));

  // Feedback
  const btn = event.target;
  btn.innerText = '✓ Saved';
  btn.style.background = '#4CAF50';
  setTimeout(() => {
    btn.innerText = 'Save Changes';
    btn.style.background = '#1976D2';
  }, 800);
}

function deleteProduct(prodId) {
  if(confirm('Delete this product?')) {
    products[currentCat] = products[currentCat].filter(p => p.id!== prodId);
    localStorage.setItem('products', JSON.stringify(products));
    renderProducts();
  }
}
</script>
</body>
</html>
