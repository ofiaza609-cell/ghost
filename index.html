<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siomai Shop POS</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
body {background:#FFF8E1; padding:10px;}
.pos {
  max-width:480px;
  margin:auto;
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  border-top:5px solid #D32F2F;
}
h2 {color:#D32F2F; text-align:center; margin-bottom:12px;}
.menu-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:15px;
}
.menu-btn {
  padding:15px 8px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg, #FFE0B2, #FFCC80);
  color:#B71C1C;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}
.menu-btn:active {transform:scale(0.95);}
.cart {
  border:2px dashed #FFCC80;
  border-radius:10px;
  padding:12px;
  min-height:150px;
  background:#fffdf7;
  margin-bottom:12px;
}
.cart-item {
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px dashed #ddd;
  font-size:14px;
}
.qty-btn {
  background:#D32F2F;
  color:white;
  border:none;
  border-radius:4px;
  width:24px;
  height:24px;
  cursor:pointer;
  margin:0 3px;
}
.total {
  font-size:24px;
  font-weight:800;
  color:#D32F2F;
  text-align:right;
  padding:10px 0;
  border-top:3px solid #D32F2F;
}
.btn-group {display:flex; gap:6px;}
.btn {
  flex:1;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}
.checkout {background:#2E7D32; color:white;}
.print {background:#1976D2; color:white;}
.clear {background:#757575; color:white;}

.receipt {
  display:none;
  font-family:monospace;
  font-size:12px;
  white-space:pre;
  line-height:1.4;
}
@media print {
  body * {visibility:hidden;}
 .receipt,.receipt * {visibility:visible;}
 .receipt {position:absolute; left:0; top:0; width:80mm;}
}
</style>
</head>
<body>

<div class="pos">
  <h2>🥟 Siomai Shop POS</h2>

  <div class="menu-grid">
    <button class="menu-btn" onclick="addItem('Pork Siomai', 8)">Pork Siomai<br>₱8</button>
    <button class="menu-btn" onclick="addItem('Beef Siomai', 8)">Beef Siomai<br>₱8</button>
    <button class="menu-btn" onclick="addItem('Chicken Siomai', 8)">Chicken Siomai<br>₱8</button>
    <button class="menu-btn" onclick="addItem('Japanese Siomai', 10)">Japanese<br>₱10</button>
    <button class="menu-btn" onclick="addItem('Siopao Asado', 25)">Siopao Asado<br>₱25</button>
    <button class="menu-btn" onclick="addItem('Siopao Bola', 25)">Siopao Bola<br>₱25</button>
    <button class="menu-btn" onclick="addItem('Rice', 15)">Rice<br>₱15</button>
    <button class="menu-btn" onclick="addItem('Softdrinks', 20)">Softdrinks<br>₱20</button>
  </div>

  <div class="cart" id="cart">
    <p style="text-align:center; color:#999;">No items yet</p>
  </div>

  <div class="total" id="total">Total: ₱0</div>

  <div class="btn-group">
    <button class="btn checkout" onclick="checkout()">Checkout</button>
    <button class="btn print" onclick="printReceipt()">Print 🖨️</button>
    <button class="btn clear" onclick="clearCart()">Clear 🗑️</button>
  </div>

  <div class="receipt" id="receipt"></div>
</div>

<script>
let cart = [];

function addItem(name, price) {
  const existing = cart.find(item => item.name === name);
  if(existing) {
    existing.qty++;
  } else {
    cart.push({name, price, qty:1});
  }
  renderCart();
}

function changeQty(index, delta) {
  cart[index].qty += delta;
  if(cart[index].qty <= 0) cart.splice(index, 1);
  renderCart();
}

function renderCart() {
  const cartDiv = document.getElementById('cart');
  let total = 0;

  if(cart.length === 0) {
    cartDiv.innerHTML = '<p style="text-align:center; color:#999;">No items yet</p>';
    document.getElementById('total').innerText = 'Total: ₱0';
    return;
  }

  let html = '';
  cart.forEach((item, i) => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    html += `
      <div class="cart-item">
        <span>${item.name}</span>
        <span>
          <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
          ${item.qty}
          <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
          = ₱${subtotal}
        </span>
      </div>
    `;
  });

  cartDiv.innerHTML = html;
  document.getElementById('total').innerText = 'Total: ₱' + total;
}

function checkout() {
  if(cart.length === 0) {
    alert('Add items muna boss!');
    return;
  }
  generateReceipt();
  alert('Sale recorded! Print mo na receipt.');
}

function generateReceipt() {
  const now = new Date();
  let receiptText = '================================\n';
  receiptText += ' SIOMAI SHOP RECEIPT\n';
  receiptText += ' ' + now.toLocaleString('en-PH') + '\n';
  receiptText += '================================\n\n';

  let total = 0;
  cart.forEach(item => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    receiptText += `${item.name}\n`;
    receiptText += `${item.qty} x ₱${item.price} = ₱${subtotal}\n\n`;
  });

  receiptText += '--------------------------------\n';
  receiptText += `TOTAL: ₱${total}\n`;
  receiptText += '================================\n';
  receiptText += ' Thank you! Come again! 🙏\n';
  receiptText += '================================\n';

  document.getElementById('receipt').innerText = receiptText;
}

function printReceipt() {
  if(cart.length === 0) {
    alert('Walang items boss!');
    return;
  }
  generateReceipt();
  document.getElementById('receipt').style.display = 'block';
  window.print();
  document.getElementById('receipt').style.display = 'none';
}

function clearCart() {
  if(confirm('Clear all items?')) {
    cart = [];
    renderCart();
  }
}
</script>
</body>
</html>
