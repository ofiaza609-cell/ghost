<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Expenses - Siomai Factory POS</title>
<style>
 * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif;}
 body {background:#FFF8E1; padding:15px; min-height:100vh;}
.container {
   max-width:480px;
   margin:auto;
   background:white;
   border-radius:20px;
   padding:20px;
   box-shadow:0 6px 20px rgba(0,0,0,0.12);
   border-top:6px solid #E91E63;
 }
 h2 { color:#D32F2F; text-align:center; margin-bottom:8px; font-size:24px; }
.subtitle { text-align:center; color:#666; font-size:13px; margin-bottom:20px; }
.back-btn {
   background:#757575; color:white; border:none; padding:10px 18px;
   border-radius:8px; cursor:pointer; margin-bottom:15px; font-size:13px; font-weight:600;
 }
.prod-form {
   background:#FFF8E1; border:2px dashed #FFCC80; border-radius:12px;
   padding:15px; margin-bottom:18px;
 }
.prod-form h4 { color:#D32F2F; margin-bottom:10px; font-size:14px; }
.input-group {margin-bottom:12px;}
.input-group label {
   font-size:12px; font-weight:700; color:#D32F2F; margin-bottom:4px; display:block;
 }
.input-group input,.input-group textarea {
   width:100%; padding:12px; border:2px solid #FFE0B2; border-radius:8px;
   font-size:14px; background:white;
 }
.input-group input:focus,.input-group textarea:focus {outline:none; border-color:#D32F2F;}
.save-btn {
   width:100%; padding:14px; background:#C2185B; color:white; border:none;
   border-radius:8px; font-weight:800; cursor:pointer; margin-top:8px; font-size:15px;
 }
.save-btn:active {transform:scale(0.98);}
.success {
   background:#4CAF50; color:white; padding:12px; border-radius:8px;
   text-align:center; margin-top:12px; display:none; font-weight:700;
 }
</style>
</head>
<body>
<div class="container">
  <button class="back-btn" onclick="window.location='index.html'">← Back to Menu</button>

  <h2>💸 Log Expenses</h2>
  <p class="subtitle">Ano binili mo today boss?</p>

  <div class="prod-form">
    <h4>+ Add Expense</h4>

    <div class="input-group">
      <label>Ano Binili / Para Saan</label>
      <input type="text" id="desc" placeholder="ex: Bigas 25kg, Gas LPG, etc">
    </div>

    <div class="input-group">
      <label style="color:#C2185B;">Amount ₱</label>
      <input type="number" id="amount" placeholder="1500" min="1" step="0.01">
    </div>

    <div class="input-group">
      <label>Petsa</label>
      <input type="date" id="date">
    </div>

    <div class="input-group">
      <label>Notes - optional</label>
      <textarea id="notes" placeholder="Dagdag detalye... resibo no., etc"></textarea>
    </div>

    <button class="save-btn" onclick="saveExpense()">✅ Save Expense</button>
    <div id="success" class="success">Saved! Naka-log na 👌</div>
  </div>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');

// Set today as default date
document.getElementById('date').value = new Date().toISOString().split('T')[0];

function saveExpense() {
  const desc = document.getElementById('desc').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);
  const date = document.getElementById('date').value;
  const notes = document.getElementById('notes').value.trim();

  if(!desc ||!amount ||!date) {
    alert('Lagay ka "Ano binili", "Amount" at "Petsa" boss!');
    return;
  }

  // Save sa expenses log
  expenses.push({
    datetime: new Date().toISOString(),
    date: date,
    description: desc,
    amount: amount,
    notes: notes
  });

  localStorage.setItem('expenses', JSON.stringify(expenses));

  // Show success + clear form
  document.getElementById('success').style.display = 'block';
  document.getElementById('desc').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('date').value = new Date().toISOString().split('T')[0];

  setTimeout(() => {
    document.getElementById('success').style.display = 'none';
  }, 2500);
}
</script>
</body>
</html>
